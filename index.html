<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>小游戏</title>
<style>
  :root {
    --primary: #07C160;
    --primary-d: #06A850;
    --bg: #f3f6f4;
    --card: #ffffff;
    --text: #2e3a33;
    --sub: #8a9790;
    --line: #eef1ee;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); padding-bottom: 90px;
  }
  .topbar {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center;
    justify-content: center; padding: 14px 16px; background: #fff;
    box-shadow: 0 2px 12px rgba(0,0,0,.05);
  }
  .brand { font-weight: 700; font-size: 18px; }
  .brand small { color: var(--sub); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%; object-fit: cover;
    background: #cfd8dc; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.12);
  }
  .btn {
    border: none; border-radius: 8px; padding: 10px 18px; font-size: 15px; font-weight: 600;
    cursor: pointer; background: var(--primary); color: #fff; transition: background .15s, opacity .15s;
  }
  .btn:active { background: var(--primary-d); opacity: .9; }
  .btn.ghost { background: #f2f2f2; color: #555; border: none; }
  .btn[disabled] { opacity: .5; }

  main { padding: 8px 14px; }
  .cat-title { font-size: 15px; font-weight: 700; margin: 18px 4px 10px; color: var(--text); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card {
    background: var(--card); border-radius: 16px; padding: 14px; cursor: pointer;
    box-shadow: 0 2px 10px rgba(0,0,0,.04); transition: transform .12s, box-shadow .12s;
    display: flex; flex-direction: column; gap: 6px;
    min-height: 110px; min-width: 0;
  }
  .card:active { transform: scale(.98); box-shadow: 0 1px 6px rgba(0,0,0,.08); }
  .card-name { font-size: 16px; font-weight: 700; }
  .card-desc { font-size: 12px; color: var(--sub); line-height: 1.4; min-height: 34px; }
  .card-best { font-size: 12px; color: var(--primary-d); margin-top: 2px; position: relative; overflow: hidden; height: 19px; min-width: 0; }
  .card-best b { color: var(--text); font-weight: 700; }
  .card-best-track { display: flex; flex-direction: column; transition: transform .5s cubic-bezier(.4,0,.2,1); }
  .card-best-item { display: flex; align-items: center; line-height: 1.6; height: 19px; flex-shrink: 0; }
  .card-best-item .best-left { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .card-best-item .best-score { flex-shrink: 0; white-space: nowrap; }

  .modal {
    position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .modal.hidden { display: none; }
  .sheet {
    background: #fff; width: 100%; max-width: 460px; border-radius: 20px 20px 0 0;
    padding: 20px 18px calc(20px + env(safe-area-inset-bottom)); animation: up .2s ease;
  }
  @keyframes up { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet-head { text-align: center; padding: 6px 0 10px; }
  .wx-badge {
    width: 54px; height: 54px; border-radius: 14px; background: var(--primary);
    margin: 0 auto 8px; display: flex; align-items: center; justify-content: center;
  }
  .wx-badge svg { width: 30px; height: 30px; }
  .sheet-head p { margin: 0; font-size: 14px; color: var(--sub); }
  .sheet-tabs { display: flex; gap: 28px; margin: 4px 4px 18px; }
  .sheet-tabs button {
    flex: none; padding: 8px 2px; border: none; background: none;
    font-size: 17px; font-weight: 600; color: #999; cursor: pointer; position: relative;
  }
  .sheet-tabs button.active { color: var(--primary); }
  .sheet-tabs button.active::after {
    content: ''; position: absolute; left: 50%; transform: translateX(-50%);
    bottom: -6px; width: 22px; height: 3px; border-radius: 2px; background: var(--primary);
  }
  .sheet input[type=text], .sheet input[type=password] {
    width: 100%; padding: 13px 14px; margin-bottom: 12px; border: 1px solid #e3e3e3;
    border-radius: 8px; font-size: 15px; outline: none; background: #f7f7f7;
  }
  .sheet input:focus { border-color: var(--primary); background: #fff; }
  .avatar-pick {
    display: block; font-size: 13px; color: var(--sub); margin-bottom: 12px;
  }
  .avatar-pick input { margin-top: 6px; font-size: 13px; }
  .msg { color: #fa5151; font-size: 13px; min-height: 18px; margin-bottom: 8px; }
  .sheet .btn { width: 100%; margin-top: 4px; padding: 13px; font-size: 17px; border-radius: 8px; }

  #toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
    background: rgba(0,0,0,.8); color: #fff; padding: 10px 18px; border-radius: 20px;
    font-size: 14px; z-index: 99; opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  #toast.show { opacity: 1; }

  .section-hint { text-align: center; color: var(--sub); font-size: 12px; margin: 22px 0 4px; }

  /* === 底部 Tab 栏 === */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: flex; background: #fff; border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabbar button {
    flex: 1; border: none; background: none; padding: 10px 0 8px;
    font-size: 12px; color: var(--sub); cursor: pointer; display: flex;
    flex-direction: column; align-items: center; gap: 3px; font-family: inherit;
  }
  .tabbar button .tab-ico { font-size: 20px; line-height: 1; }
  .tabbar button.active { color: var(--primary); font-weight: 600; }
  .page { display: none; }
  .page.active { display: block; }

  /* === 主页快捷入口 === */
  .quick-bar {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px;
  }
  .quick-card {
    background: var(--card); border-radius: 14px; padding: 14px; cursor: pointer;
    box-shadow: 0 2px 10px rgba(0,0,0,.04); transition: transform .12s;
    display: flex; align-items: center; gap: 10px;
  }
  .quick-card:active { transform: scale(.98); }
  .quick-emoji { font-size: 28px; flex-shrink: 0; }
  .quick-info { flex: 1; min-width: 0; }
  .quick-label { font-size: 11px; color: var(--sub); margin-bottom: 2px; }
  .quick-name { font-size: 15px; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .quick-sub { font-size: 11px; color: var(--sub); margin-top: 2px; }
  .quick-empty { text-align: center; color: var(--sub); font-size: 13px; padding: 10px 0; }

  /* === 我的页 === */
  .me-profile {
    background: var(--card); border-radius: 16px; padding: 22px 18px;
    display: flex; align-items: center; gap: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.04);
  }
  .me-avatar {
    width: 64px; height: 64px; border-radius: 50%; object-fit: cover;
    background: #e0e0e0; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.12);
    flex-shrink: 0;
  }
  .me-info { flex: 1; min-width: 0; }
  .me-name { font-size: 18px; font-weight: 700; }
  .me-sub { font-size: 12px; color: var(--sub); margin-top: 4px; }
  .me-records { margin-top: 14px; }
  .me-section-title {
    font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 8px;
  }
  .me-record-list {
    display: flex; flex-direction: column; gap: 6px;
  }
  .me-record-item {
    background: var(--card); border-radius: 12px; padding: 12px 14px;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,.03); font-size: 13px;
  }
  .me-record-game { font-weight: 600; color: var(--text); flex: 1; min-width: 0; }
  .me-record-score { color: var(--primary-d); font-weight: 700; white-space: nowrap; }
  .me-record-time { font-size: 11px; color: var(--sub); white-space: nowrap; }
  .me-record-empty { text-align: center; color: var(--sub); font-size: 13px; padding: 12px 0; }
  .me-record-more {
    text-align: center; padding: 8px 0 0;
  }
  .me-record-more button {
    border: none; background: var(--card); color: var(--primary-d); font-size: 13px;
    padding: 8px 20px; border-radius: 8px; cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,.03);
  }
  .me-record-more button:active { opacity: .8; }
  .me-menu {
    margin-top: 14px; background: var(--card); border-radius: 16px; overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.04);
  }
  .me-menu-item {
    display: flex; align-items: center; gap: 12px; padding: 16px;
    border-bottom: 1px solid var(--line); cursor: pointer; font-size: 15px;
  }
  .me-menu-item:last-child { border-bottom: none; }
  .me-menu-item:active { background: #fafafa; }
  .me-menu-ico { font-size: 20px; }
  .me-menu-arrow { margin-left: auto; color: #ccc; font-size: 16px; }
  .me-menu-item-group { border-top: 1px solid var(--line); }

  /* === 天梯榜 Tab === */
  .lb-layout {
    display: flex; height: calc(100vh - 120px); /* 减去 topbar + tabbar */
    overflow: hidden;
  }
  .lb-sidebar {
    width: 130px; flex-shrink: 0; overflow-y: auto; background: #fff;
    border-right: 1px solid var(--line);
  }
  .lb-sidebar-item {
    padding: 14px 12px; font-size: 14px; cursor: pointer; color: var(--text);
    border-bottom: 1px solid var(--line); transition: background .15s;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .lb-sidebar-item:active { background: #fafafa; }
  .lb-sidebar-item.active { color: var(--primary); font-weight: 700; background: #f0faf3; }
  .lb-sidebar-item .lb-skip-badge { font-size: 10px; color: var(--sub); display: block; }
  .lb-content {
    flex: 1; overflow-y: auto; padding: 14px;
  }
  .lb-content h2 { font-size: 16px; margin: 0 0 12px; color: var(--text); }
  .lb-diff-title {
    font-size: 13px; font-weight: 700; color: #4472c4; padding: 10px 0 4px;
    border-bottom: 1px solid var(--line); margin-top: 4px;
  }
  .lb-diff-title:first-child { margin-top: 0; padding-top: 2px; }
  .lb-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 0;
    border-bottom: 1px solid #f5f5f5; font-size: 14px;
  }
  .lb-item:last-child { border-bottom: none; }
  .lb-rank { width: 24px; height: 24px; border-radius: 50%; background: #81C784; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: none; }
  .lb-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: #e0e0e0; border: 1px solid #fff; flex-shrink: 0; }
  .lb-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-score { color: #2e7d32; font-weight: 600; white-space: nowrap; }
  .lb-empty { text-align: center; color: var(--sub); font-size: 14px; padding: 30px 0; }
  .lb-loading { text-align: center; color: var(--sub); font-size: 14px; padding: 30px 0; }
  .lb-placeholder {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; color: var(--sub); font-size: 14px;
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">🎮 小游戏</div>
</header>

<!-- 游戏页 -->
<section id="pageGames" class="page active">
  <main>
    <!-- 最近游玩 & 最爱游戏 -->
    <div id="quickSection" style="display:none">
      <div class="cat-title">📌 快捷入口</div>
      <div class="quick-bar" id="quickBar"></div>
    </div>
    <div id="gameList"></div>
    <div class="section-hint">登录后跳转游戏自动带上身份 · 成绩进入天梯榜</div>
  </main>
</section>

<!-- 天梯榜页 -->
<section id="pageLeaderboard" class="page">
  <div class="lb-layout">
    <div class="lb-sidebar" id="lbSidebar"></div>
    <div class="lb-content" id="lbContent">
      <div class="lb-placeholder">← 选择一个游戏查看天梯榜</div>
    </div>
  </div>
</section>

<!-- 我的页 -->
<section id="pageMe" class="page">
  <main>
    <div class="me-profile" id="meProfile"></div>
    <div class="me-records" id="meRecords" style="display:none">
      <div class="me-section-title">🕐 近期游戏记录</div>
      <div class="me-record-list" id="meRecentScores"></div>
      <div class="me-section-title" style="margin-top:18px">🏆 个人最强记录</div>
      <div class="me-record-list" id="meBestScores"></div>
    </div>
    <div class="me-menu">
      <div class="me-menu-item" onclick="openShare()">
        <span class="me-menu-ico">📤</span>分享合集卡片
        <span class="me-menu-arrow">›</span>
      </div>
      <div id="meLoggedActions" class="me-menu-item-group" style="display:none">
        <div class="me-menu-item" onclick="openModal('profileModal')">
          <span class="me-menu-ico">✏️</span>编辑资料
          <span class="me-menu-arrow">›</span>
        </div>
        <div class="me-menu-item" onclick="doLogout()">
          <span class="me-menu-ico">🚪</span>退出登录
          <span class="me-menu-arrow">›</span>
        </div>
      </div>
    </div>
  </main>
</section>

<!-- 底部 Tab 栏 -->
<nav class="tabbar">
  <button id="tabGames" class="active" onclick="switchTab('games')">
    <span class="tab-ico">🏠</span>主页
  </button>
  <button id="tabLeaderboard" onclick="switchTab('leaderboard')">
    <span class="tab-ico">🏆</span>天梯榜
  </button>
  <button id="tabMe" onclick="switchTab('me')">
    <span class="tab-ico">👤</span>我的
  </button>
</nav>

<!-- 登录 / 注册 -->
<div id="authModal" class="modal hidden">
  <div class="sheet">
    <div class="sheet-head">
      <div class="wx-badge">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M9 3C4.9 3 1.5 5.9 1.5 9.4c0 2 1.1 3.8 2.9 5L3.4 17l2.4-1.2c.9.3 1.9.4 2.9.4h.6a5.6 5.6 0 0 1-.2-1.5C9.1 11.1 12.6 8.4 16.9 8.4h.6C16.7 5.3 13.2 3 9 3Zm-2.4 4.2a1 1 0 1 1 0 2 1 1 0 0 1 0-2Zm4.8 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2Z"/><path d="M22.5 14.1c0-2.8-2.8-5.1-6.2-5.1s-6.2 2.3-6.2 5.1 2.8 5.1 6.2 5.1c.7 0 1.4-.1 2.1-.3l1.9 1-.5-1.6c1.5-.9 2.7-2.3 2.7-3.9Zm-8.2-.9a.8.8 0 1 1 0 1.6.8.8 0 0 1 0-1.6Zm3.9 0a.8.8 0 1 1 0 1.6.8.8 0 0 1 0-1.6Z"/></svg>
      </div>
      <p>登录后畅玩全部游戏</p>
    </div>
    <div class="sheet-tabs">
      <button data-tab="login" class="active" onclick="switchAuth('login')">登录</button>
      <button data-tab="register" onclick="switchAuth('register')">注册</button>
    </div>
    <input id="authNick" type="text" placeholder="昵称" maxlength="20" autocomplete="username">
    <input id="authPw" type="password" placeholder="密码（≥6位）" autocomplete="current-password">
    <label class="avatar-pick">头像（选填，≤2MB，支持 jpg/png/webp/gif）
      <input id="authAvatar" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
    </label>
    <div id="authMsg" class="msg"></div>
    <button class="btn" onclick="submitAuth()">登录</button>
    <button class="btn ghost" style="margin-top:10px" onclick="closeModal('authModal')">取消</button>
  </div>
</div>

<!-- 改资料 -->
<div id="profileModal" class="modal hidden">
  <div class="sheet">
    <div class="sheet-tabs"><button class="active">我的资料</button></div>
    <input id="pfNick" type="text" placeholder="新昵称（留空不改）" maxlength="20">
    <input id="pfPw" type="password" placeholder="新密码（≥6位，留空不改）">
    <label class="avatar-pick">更换头像（≤2MB）
      <input id="pfAvatar" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
    </label>
    <div id="pfMsg" class="msg"></div>
    <button class="btn" onclick="submitProfile()">保存</button>
    <button class="btn ghost" style="margin-top:10px" onclick="closeModal('profileModal')">取消</button>
  </div>
</div>

<div id="toast"></div>

<script>
// === 游戏数据：从 API 动态加载，带静态 fallback ===
let GAMES = {
  categories: [
    { emoji: '🎭', name: '模拟体验', games: [
      { id: 'life-restart-simulator', name: '人生重开模拟器', desc: '异世界转生，选择种族天赋经历人生抉择', url: 'https://life-restart-simulator-a7b.pages.dev/' },
      { id: 'spend-money-for-musk', name: '替马斯克花钱', desc: '消费模拟器，挥霍巨额财富购买各类商品', url: 'https://spend-money-for-musk.pages.dev/' },
    ]},
    { emoji: '🧩', name: '休闲娱乐', games: [
      { id: 'flop', name: '翻牌消消乐', desc: '日系清新记忆配对，三种难度计时挑战', url: 'https://flop-39t.pages.dev/', diffs: [{ key: 'easy', label: '简' }, { key: 'medium', label: '中' }, { key: 'hard', label: '难' }] },
      { id: 'greedy-snake', name: '贪吃蛇', desc: '经典贪吃蛇，键触双控高分排行', url: 'https://greedy-snake-3wq.pages.dev/', diffs: [{ key: 'easy', label: '简' }, { key: 'medium', label: '中' }, { key: 'hard', label: '难' }] },
      { id: 'mine-sweeper', name: '扫雷', desc: '经典扫雷三档难度，支持触屏长按插旗', url: 'https://mine-sweeper-2f1.pages.dev/', diffs: [{ key: 'easy', label: '简' }, { key: 'medium', label: '中' }, { key: 'hard', label: '难' }] },
      { id: 'tetris', name: '俄罗斯方块', desc: '经典俄罗斯方块，键盘触屏双控高分排行', url: 'https://tetris-t83.pages.dev/' },
      { id: 'lunch', name: '中午吃什么', desc: '老虎机滚动抽选，治愈你的选择困难症', url: 'https://lunch-1t7.pages.dev/', skip: true },
    ]},
    { emoji: '🔮', name: '玄学趣玩', games: [
      { id: 'holy-grail', name: '掷筊问卜', desc: '闽南掷筊文化塔罗占卜，圣杯笑杯阴杯判定', url: 'https://holy-grail-b8u.pages.dev/' },
    ]},
    { emoji: '🧪', name: '脑力挑战', games: [
      { id: 'human-bench', name: '人类基准', desc: '7项认知测试，反应速度记忆瞄准全方位挑战', url: 'https://human-bench.pages.dev/' },
    ]},
  ]
};

// 默认头像
const DEFAULT_AVATAR = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==";

const MINE_BASES = { easy: 100000, medium: 300000, hard: 600000 };
function fmtLeaderScore(gameId, difficulty, rawScore) {
  if (gameId === 'mine-sweeper') {
    const base = MINE_BASES[difficulty] || 100000;
    const s = (Number(rawScore) || 0) - base;
    return (Number.isInteger(s) ? String(s) : s.toFixed(1)) + 's';
  }
  if (gameId === 'greedy-snake') return fmtScore(rawScore) + ' 节';
  return fmtScore(rawScore);
}

let GP = null;
let currentUser = null;
let authTab = 'login';
let _allGamesFlat = []; // 从 API 加载的扁平游戏列表

// === 动态加载 SDK ===
(function loadSDK() {
  const API_BASE = new URLSearchParams(location.search).get('api') || 'https://api.w1lkin.site';
  window.__GP_API_BASE__ = API_BASE;
  window.__GP_HUB_URL__ = location.origin;
  const s = document.createElement('script');
  s.src = API_BASE + '/sdk.js';
  s.onload = boot;
  s.onerror = () => toast('平台 SDK 加载失败，请检查网络或 ?api= 参数');
  document.head.appendChild(s);
})();

async function boot() {
  GP = window.GamePlatform;
  GP.init();
  await loadGamesFromAPI();
  renderGames();
  if (GP.getToken()) {
    GP.getUser().then(u => u ? onLogin(u) : onLogout()).catch(onLogout);
  } else {
    onLogout();
    openModal('authModal');
  }
  loadBests();
}

// === 从 API 加载游戏列表（优先数据库，降级静态配置）===
async function loadGamesFromAPI() {
  try {
    const games = await GP.getGames();
    if (games && games.length > 0) {
      // 按 category 分组
      const catMap = new Map();
      games.forEach(g => {
        if (!catMap.has(g.category)) {
          catMap.set(g.category, { emoji: g.emoji || '🎮', name: g.category, games: [] });
        }
        catMap.get(g.category).games.push({
          id: g.game_id,
          name: g.label,
          desc: g.desc || '',
          url: g.url || '',
          skip: g.skip,
          diffs: g.diffs || null,
        });
      });
      // 按分类名排序（保持一致的展示顺序）
      const catOrder = ['模拟体验', '休闲娱乐', '玄学趣玩', '脑力挑战'];
      const categories = [];
      catOrder.forEach(name => {
        if (catMap.has(name)) categories.push(catMap.get(name));
      });
      // 处理未知分类
      catMap.forEach((v, k) => {
        if (!catOrder.includes(k)) categories.push(v);
      });
      GAMES.categories = categories;
      // 构建扁平列表
      _allGamesFlat = games.map(g => ({
        id: g.game_id, name: g.label, desc: g.desc || '', url: g.url || '',
        skip: g.skip, diffs: g.diffs || null, direction: g.direction,
      }));
    }
  } catch (e) {
    console.warn('load games from API failed, using static fallback:', e);
    buildFlatFromStatic();
  }
}

function buildFlatFromStatic() {
  const flat = [];
  GAMES.categories.forEach(cat => {
    cat.games.forEach(g => flat.push({ ...g, direction: 'desc' }));
  });
  _allGamesFlat = flat;
}

function esc(s) { return String(s).replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c])); }
function fmtScore(s) {
  if (typeof s !== 'number' || Number.isNaN(s)) return s;
  return Number.isInteger(s) ? String(s) : s.toFixed(1);
}
function mapErr(m) {

// === 快捷入口：最近游玩 + 最爱游戏 ===
async function loadQuickEntries() {
  if (!GP.getToken()) { document.getElementById('quickSection').style.display = 'none'; return; }
  if (!_allGamesFlat.length) { buildFlatFromStatic(); }

  const quickBar = document.getElementById('quickBar');
  const quickSection = document.getElementById('quickSection');
  quickBar.innerHTML = '';

  try {
    // 拉取所有游戏的个人记录，找出最近游玩和最爱
    const gameIds = _allGamesFlat.filter(g => !g.skip).map(g => g.id);
    const results = await Promise.all(
      gameIds.map(id => GP.getMyScores(id, 50).then(items => ({ gameId: id, items })))
    );

    // 最近游玩：各游戏最近一次游玩时间，取 top 2
    let recentList = [];
    results.forEach(({ gameId, items }) => {
      if (items.length > 0) {
        recentList.push({ gameId, lastPlayed: Math.max(...items.map(i => i.created_at)), count: items.length });
      }
    });
    recentList.sort((a, b) => b.lastPlayed - a.lastPlayed);
    const topRecent = recentList.slice(0, 2);

    // 最爱游戏：游玩次数最多，取 top 2
    let favList = [...recentList];
    favList.sort((a, b) => b.count - a.count);
    const topFav = favList.slice(0, 2);

    const entries = [];
    if (topRecent.length > 0) {
      const g = findGame(topRecent[0].gameId);
      if (g) entries.push({ type: 'recent', label: '🕐 最近游玩', game: g, time: topRecent[0].lastPlayed });
    }
    if (topRecent.length > 1) {
      const g = findGame(topRecent[1].gameId);
      if (g) entries.push({ type: 'recent', label: '🕐 最近游玩', game: g, time: topRecent[1].lastPlayed });
    }

    if (entries.length < 2 && topFav.length > 0) {
      // 用最爱游戏补充
      for (const fav of topFav) {
        if (entries.length >= 2) break;
        if (entries.some(e => e.game.id === fav.gameId)) continue;
        const g = findGame(fav.gameId);
        if (g) entries.push({ type: 'fav', label: '❤️ 最爱游戏', game: g, count: fav.count });
      }
    }

    if (entries.length === 0) {
      quickSection.style.display = 'none';
      return;
    }
    quickSection.style.display = '';

    quickBar.innerHTML = entries.map(e => {
      const timeStr = e.time ? new Date(e.time).toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' }) : '';
      const sub = e.type === 'recent' ? timeStr : (e.count ? '玩了 ' + e.count + ' 次' : '');
      return `<div class="quick-card" onclick="openGameById('${e.game.id}')">
        <span class="quick-emoji">${e.type === 'recent' ? '🕐' : '❤️'}</span>
        <div class="quick-info">
          <div class="quick-label">${e.label}</div>
          <div class="quick-name">${esc(e.game.name)}</div>
          ${sub ? '<div class="quick-sub">' + sub + '</div>' : ''}
        </div>
      </div>`;
    }).join('');
  } catch (e) {
    quickSection.style.display = 'none';
  }
}

function findGame(gameId) {
  for (const cat of GAMES.categories) {
    for (const g of cat.games) {
      if (g.id === gameId) return g;
    }
  }
  return null;
}

// === 最强者 ===
const _bestTimers = {};
async function loadBests() {
  for (const cat of GAMES.categories) {
    for (const g of cat.games) {
      if (g.skip) continue;
      const el = document.getElementById('best-' + g.id);
      try {
        if (g.diffs && g.diffs.length) {
          const results = await Promise.all(
            g.diffs.map(d => GP.getLeaderboard(g.id, 1, d.key).then(items => ({ label: d.label, top: items[0] })))
          );
          const items = results.filter(r => r.top);
          if (!items.length) { if (el) el.textContent = '👑 暂无记录'; continue; }
          if (el) {
            el.innerHTML = '<div class="card-best-track" id="best-track-' + g.id + '">' +
              items.map(r => {
                const diffKey = r.top.meta ? (typeof r.top.meta === 'string' ? JSON.parse(r.top.meta).difficulty : r.top.meta.difficulty) : null;
                return '<span class="card-best-item"><span class="best-left">👑 ' + esc(r.label) + ' <b>' + esc(r.top.nickname) + '</b></span><span class="best-score">' + fmtLeaderScore(g.id, diffKey, r.top.score) + '</span></span>';
              }).join('') +
              '</div>';
            startBestFlip(g.id, items.length);
          }
        } else {
          const items = await GP.getLeaderboard(g.id, 1);
          if (el && items && items[0]) {
            const top = items[0];
            el.innerHTML = `<span style="display:flex;align-items:center;min-width:0"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0">👑 最强者：<b>${esc(top.nickname)}</b></span><span style="flex-shrink:0;white-space:nowrap"> · ${fmtScore(top.score)}</span></span>`;
          } else if (el) {
            el.textContent = '👑 暂无记录';
          }
        }
      } catch (e) { if (el) el.textContent = '👑 加载失败'; }
    }
  }
}
function startBestFlip(gameId, count) {
  const track = document.getElementById('best-track-' + gameId);
  if (!track) return;
  if (count <= 1) return;
  clearInterval(_bestTimers[gameId]);
  const firstClone = track.children[0].cloneNode(true);
  track.appendChild(firstClone);
  const itemHeight = 19;
  let idx = 0;
  const step = () => {
    idx++;
    track.style.transition = 'transform .5s cubic-bezier(.4,0,.2,1)';
    track.style.transform = 'translateY(-' + (idx * itemHeight) + 'px)';
    if (idx >= count) {
      setTimeout(() => {
        track.style.transition = 'none';
        track.style.transform = 'translateY(0)';
        idx = 0;
        track.offsetHeight;
        track.style.transition = 'transform .5s cubic-bezier(.4,0,.2,1)';
      }, 500);
    }
  };
  _bestTimers[gameId] = setInterval(step, 3000);
}

let _lbGames = [];
let _lbSelectedGame = null;

function initLeaderboardTab() {
  const sidebar = document.getElementById('lbSidebar');
  if (sidebar.children.length > 0) return; // 已初始化

  // 构建游戏列表（按名称首字母排序，skip 的游戏排在后面）
  _lbGames = [];

    cat.games.forEach(g => _lbGames.push(g));
  });
  _lbGames.sort((a, b) => {
    if (a.skip !== b.skip) return a.skip ? 1 : -1;
    return a.name.localeCompare(b.name, 'zh-CN');
  });

  sidebar.innerHTML = _lbGames.map(g =>
    `<div class="lb-sidebar-item${g.skip ? ' lb-skip-item' : ''}" data-game="${g.id}" onclick="selectLBGame('${g.id}')">
      ${esc(g.name)}${g.skip ? '<span class="lb-skip-badge">娱乐向</span>' : ''}
    </div>`
  ).join('');

  const first = _lbGames.find(g => !g.skip);

function selectLBGame(gameId) {
  _lbSelectedGame = gameId;
  // 更新侧边栏高亮
  document.querySelectorAll('.lb-sidebar-item').forEach(el => {
    el.classList.toggle('active', el.dataset.game === gameId);
  });

  const g = findGame(gameId);
  if (!g) return;

  const content = document.getElementById('lbContent');
  content.innerHTML = '<div class="lb-loading">加载中…</div>';

  if (g.skip) {
    content.innerHTML = '<div class="lb-empty">🎲 娱乐向游戏，不计入天梯榜</div>';
    return;
  }

  renderLeaderboardContent(g);
}

async function renderLeaderboardContent(g) {
  const content = document.getElementById('lbContent');
  if (_lbSelectedGame !== g.id) return; // 用户已切换

  try {
    if (g.diffs && g.diffs.length) {
      // 多难度游戏
      const results = await Promise.all(
        g.diffs.map(d => GP.getLeaderboard(g.id, 10, d.key).then(items => ({ label: d.label, key: d.key, items })))
      );
      const hasAny = results.some(r => r.items && r.items.length > 0);
      if (!hasAny) { content.innerHTML = '<div class="lb-empty">暂无记录，快来抢榜首！</div>'; return; }

      content.innerHTML = `<h2>🏆 ${esc(g.name)} 天梯榜</h2>` + results.map(r => {
        let html = '<div class="lb-diff-title">' + esc(r.label) + '</div>';
        if (!r.items || !r.items.length) {
          html += '<div class="lb-empty">暂无记录</div>';
        } else {
          html += r.items.map((it, i) => renderLBItem(i, it, g.id, r.key)).join('');
        }
        return html;
      }).join('');
    } else {
      // 单难度游戏
      const items = await GP.getLeaderboard(g.id, 10);
      if (!items || !items.length) { content.innerHTML = '<div class="lb-empty">暂无记录，快来抢榜首！</div>'; return; }
      content.innerHTML = `<h2>🏆 ${esc(g.name)} 天梯榜</h2>` + items.map((it, i) => renderLBItem(i, it, g.id)).join('');
    }
  } catch (e) {
    content.innerHTML = '<div class="lb-empty">加载失败，请稍后重试</div>';
  }
}

function renderLBItem(i, it, gameId, diffKey) {
  const medals = ['🥇', '🥈', '🥉'];
  const rankHtml = i < 3 ? medals[i] : '<span class="lb-rank">' + (i + 1) + '</span>';
  const scoreStr = diffKey ? fmtLeaderScore(gameId, diffKey, it.score) : fmtScore(it.score);
  return `<div class="lb-item">
    ${rankHtml}
    <img class="lb-avatar" src="${it.avatar_url || DEFAULT_AVATAR}" onerror="this.style.background='#e0e0e0'">
    <span class="lb-name">${esc(it.nickname || '匿名')}</span>
    <span class="lb-score">${scoreStr}</span>
  </div>`;
}

// === 个人游戏记录 ===
let _myRecordsCache = null;
async function loadMyRecords() {
  const recentEl = document.getElementById('meRecentScores');
  const bestEl = document.getElementById('meBestScores');
  recentEl.innerHTML = '<div class="me-record-empty">加载中…</div>';
  bestEl.innerHTML = '<div class="me-record-empty">加载中…</div>';

  const allGames = [];
  GAMES.categories.forEach(cat => {
    cat.games.forEach(g => {
      if (!g.skip) allGames.push(g);
    });
  });

  try {
    const results = await Promise.all(
      allGames.map(async (g) => {
        const items = await GP.getMyScores(g.id, 20);
        return { game: g, items };
      })
    );

    let recentAll = [];
    results.forEach(({ game, items }) => {
      items.forEach(it => {
        recentAll.push({
          gameName: game.name, gameId: game.id, score: it.score,
          meta: it.meta, created_at: it.created_at,
        });
      });
    });
    recentAll.sort((a, b) => b.created_at - a.created_at);

    let bestList = [];
    results.forEach(({ game, items }) => {
      if (!items.length) return;
      if (!game.diffs || !game.diffs.length) {
        let best = items[0];
        items.forEach(it => { if (it.score > best.score) best = it; });
        bestList.push({ gameName: game.name, gameId: game.id, score: best.score, difficulty: null });
      } else {
        game.diffs.forEach(d => {
          const diffItems = items.filter(it => {
            try {
              const m = typeof it.meta === 'string' ? JSON.parse(it.meta) : (it.meta || {});
              return m.difficulty === d.key;
            } catch (e) { return false; }
          });
          if (!diffItems.length) return;
          let best = diffItems[0];
          diffItems.forEach(it => { if (it.score > best.score) best = it; });
          bestList.push({ gameName: game.name, gameId: game.id, score: best.score, difficulty: d.label });
        });
      }
    });
    bestList.sort((a, b) => {
      if (a.gameName !== b.gameName) return a.gameName.localeCompare(b.gameName);
      return (a.difficulty || '').localeCompare(b.difficulty || '');
    });

    _myRecordsCache = { recentAll, bestList };
    renderRecentScores(recentEl, 5);
    renderBestScores(bestEl, 5);
  } catch (e) {
    recentEl.innerHTML = '<div class="me-record-empty">加载失败，请稍后重试</div>';
    bestEl.innerHTML = '<div class="me-record-empty">加载失败，请稍后重试</div>';
  }
}
function renderRecentScores(el, limit) {
  if (!_myRecordsCache) return;
  const { recentAll } = _myRecordsCache;
  const items = recentAll.slice(0, limit);
  if (!items.length) { el.innerHTML = '<div class="me-record-empty">暂无游戏记录，快去玩一局吧</div>'; return; }
  let html = items.map(r => {
    let diffLabel = '', diffKey = null;
    try {
      const m = typeof r.meta === 'string' ? JSON.parse(r.meta) : (r.meta || {});
      if (m.difficulty) {
        const dm = { easy: '简', medium: '中', hard: '难' };
        diffLabel = ' · ' + (dm[m.difficulty] || m.difficulty);
        diffKey = m.difficulty;
      }
    } catch (e) {}
    const time = new Date(r.created_at).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    return `<div class="me-record-item">
      <span class="me-record-game">${esc(r.gameName)}${diffLabel}</span>
      <span class="me-record-score">${fmtLeaderScore(r.gameId, diffKey, r.score)}</span>
      <span class="me-record-time">${time}</span>
    </div>`;
  }).join('');
  if (recentAll.length > 5) {
    html += '<div class="me-record-more"><button onclick="renderRecentScores(document.getElementById(\'meRecentScores\'), ' + (limit === 5 ? 10 : 5) + ')">' + (limit === 5 ? '查看更多' : '收起') + '</button></div>';
  }
  el.innerHTML = html;
}
function renderBestScores(el, limit) {
  if (!_myRecordsCache) return;
  const { bestList } = _myRecordsCache;
  const items = bestList.slice(0, limit);
  if (!items.length) { el.innerHTML = '<div class="me-record-empty">暂无记录</div>'; return; }
  let html = items.map(b => {
    const diffLabel = b.difficulty ? ' · ' + b.difficulty : '';
    const diffKey = b.difficulty ? { '简': 'easy', '中': 'medium', '难': 'hard' }[b.difficulty] || null : null;
    return `<div class="me-record-item">
      <span class="me-record-game">${esc(b.gameName)}${diffLabel}</span>
      <span class="me-record-score">${fmtLeaderScore(b.gameId, diffKey, b.score)}</span>
    </div>`;
  }).join('');
  if (bestList.length > 5) {
    html += '<div class="me-record-more"><button onclick="renderBestScores(document.getElementById(\'meBestScores\'), ' + (limit === 5 ? 10 : 5) + ')">' + (limit === 5 ? '查看更多' : '收起') + '</button></div>';
  }
  el.innerHTML = html;
}

async function submitAuth() {
  const nick = val('authNick').trim();
  const pw = val('authPw');
  const file = document.getElementById('authAvatar').files[0];
  const msg = document.getElementById('authMsg');
  msg.textContent = '';
  if (!nick || !pw) { msg.textContent = '请填写昵称和密码'; return; }
  if (authTab === 'register' && pw.length < 6) { msg.textContent = '密码至少6位'; return; }
  if (file) {
    if (file.size > 2 * 1024 * 1024) { msg.textContent = '头像超过2MB'; return; }
    if (!['image/jpeg', 'image/png', 'image/webp', 'image/gif'].includes(file.type)) { msg.textContent = '头像类型不支持'; return; }
  }
  try {
    let user;
    if (authTab === 'register') user = await GP.register(nick, pw);
    else user = await GP.login(nick, pw);
    if (authTab === 'register' && file) {
      try {
        const url = await GP.uploadAvatar(file);
        user = await GP.updateProfile({ avatar_url: url });
      } catch (e) {
        if (e.message === 'quota_exceeded') msg.textContent = '本月头像上传额度已满，已为你完成注册，可稍后再试';
      }
    }
    onLogin(user);
    const redirect = new URLSearchParams(location.search).get('redirect');
    if (redirect) {
      try {
        const u = new URL(redirect);
        u.searchParams.set('token', GP.getToken());
        u.searchParams.set('api', GP.API_BASE);
        location.replace(u.toString());
        return;
      } catch (e) {}
    }
    closeModal('authModal');
    toast(authTab === 'register' ? '注册成功 🎉' : '登录成功');
    if (_pendingLoginAction) { const act = _pendingLoginAction; _pendingLoginAction = null; act(); }
  } catch (e) { msg.textContent = mapErr(e.message); }
}

// === 改资料 ===
async function submitProfile() {
  const nick = val('pfNick').trim();
  const pw = val('pfPw');
  const file = document.getElementById('pfAvatar').files[0];
  const msg = document.getElementById('pfMsg');
  msg.textContent = '';
  const patch = {};
  if (nick) patch.nickname = nick;
  if (pw) {
    if (pw.length < 6) { msg.textContent = '密码至少6位'; return; }
    patch.password = pw;
  }
  try {
    let user = currentUser;
    if (Object.keys(patch).length) user = await GP.updateProfile(patch);
    if (file) {
      if (file.size > 2 * 1024 * 1024) { msg.textContent = '头像超过2MB'; return; }
      if (!['image/jpeg', 'image/png', 'image/webp', 'image/gif'].includes(file.type)) { msg.textContent = '头像类型不支持'; return; }
      const url = await GP.uploadAvatar(file);
      user = await GP.updateProfile({ avatar_url: url });
    }
    onLogin(user);
    closeModal('profileModal');
    toast('资料已更新');
  } catch (e) { msg.textContent = mapErr(e.message); }
}

document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.add('hidden'); });
});
